<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root { --accent: hsl(210, 70%, 58%); --accent-light: hsl(210, 80%, 73%); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  h1 { font-size: 2rem; letter-spacing: 0.3em; margin-bottom: 0.5rem; color: var(--accent); }
  .hud {
    display: flex; gap: 2rem; margin-bottom: 0.75rem;
    font-size: 1.1rem; font-variant-numeric: tabular-nums;
  }
  .hud span b { color: #facc15; }
  .wrap { position: relative; }
  canvas {
    display: block;
    background: #1e293b;
    border: 3px solid #334155;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 8px;
    text-align: center; gap: 0.75rem;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 2rem; color: var(--accent); }
  .overlay p { color: #94a3b8; }
  .overlay button {
    margin-top: 0.5rem; padding: 0.6rem 1.8rem;
    font-size: 1rem; font-weight: 600;
    background: var(--accent); color: #0f172a;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .overlay button:hover { background: var(--accent-light); }
  .controls { margin-top: 0.75rem; color: #64748b; font-size: 0.9rem; }
  .credit { margin-top: 0.5rem; color: #64748b; font-size: 0.85rem; }
  .credit a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .credit a:hover { text-decoration: underline; }
  select {
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #475569; border-radius: 4px; padding: 0.2rem 0.4rem;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Speed:
      <select id="speed">
        <option value="140">Slow</option>
        <option value="100" selected>Normal</option>
        <option value="65">Fast</option>
      </select>
    </span>
    <span>Color:
      <select id="color">
        <option value="210">Blue</option>
        <option value="142">Green</option>
        <option value="270">Purple</option>
        <option value="28">Orange</option>
        <option value="330">Pink</option>
        <option value="48">Gold</option>
      </select>
    </span>
  </div>
  <div class="wrap">
    <canvas id="board" width="500" height="500"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">SNAKE</h2>
      <p id="ovText">Eat the food, don't hit the walls or yourself.</p>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <div class="controls">Arrow keys / WASD to move &middot; Space or P to pause &middot; swipe on touch screens</div>
  <div class="credit">Created by <a href="https://github.com/niteshsrivastava484" target="_blank" rel="noopener">Nitesh Srivastava</a> &middot; <a href="snakes-and-ladders/">Play Snakes &amp; Ladders</a></div>

<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const GRID = 25;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const speedEl = document.getElementById("speed");
  const colorEl = document.getElementById("color");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");

  let snake, dir, dirQueue, food, score, best, timer, state; // state: idle | running | paused | over

  best = Number(localStorage.getItem("snakeBest") || 0);
  bestEl.textContent = best;

  let hue = Number(localStorage.getItem("snakeHue") || 210);

  function applyColor() {
    colorEl.value = hue;
    document.documentElement.style.setProperty("--accent", `hsl(${hue}, 70%, 58%)`);
    document.documentElement.style.setProperty("--accent-light", `hsl(${hue}, 80%, 73%)`);
  }

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  function start() {
    reset();
    state = "running";
    overlay.classList.add("hidden");
    clearInterval(timer);
    timer = setInterval(tick, Number(speedEl.value));
    draw();
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      clearInterval(timer);
      showOverlay("PAUSED", "Press Space or P to resume.", "Resume");
    } else if (state === "paused") {
      state = "running";
      overlay.classList.add("hidden");
      timer = setInterval(tick, Number(speedEl.value));
    }
  }

  function gameOver() {
    state = "over";
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snakeBest", best);
      bestEl.textContent = best;
    }
    showOverlay("GAME OVER", `Score: ${score}  ·  Best: ${best}`, "Play Again");
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.remove("hidden");
  }

  function tick() {
    // Apply at most one queued turn per tick so quick double-taps can't reverse into the body
    if (dirQueue.length) dir = dirQueue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = head.x === food.x && head.y === food.y;
    // Tail moves out of the way this tick unless we're growing
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      draw();
      return gameOver();
    }

    snake.unshift(head);
    if (eating) {
      score += 10;
      scoreEl.textContent = score;
      if (snake.length === GRID * GRID) { draw(); return gameOver(); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle checkerboard
    ctx.fillStyle = "#22304a";
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // food
    ctx.fillStyle = "#f87171";
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(food.x * CELL + CELL / 2 - 1, food.y * CELL + 2, 3, CELL * 0.22);

    // snake: gradient from head to tail
    snake.forEach((s, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      const light = 60 - t * 25;
      ctx.fillStyle = i === 0 ? `hsl(${hue}, 80%, 73%)` : `hsl(${hue}, 70%, ${light}%)`;
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
    });

    // eyes
    const h = snake[0];
    ctx.fillStyle = "#0f172a";
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const px = -dir.y, py = dir.x; // perpendicular
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * 4 + px * side * 5, cy + dir.y * 4 + py * side * 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function turn(nx, ny) {
    if (state !== "running") return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
    if (dirQueue.length < 3) dirQueue.push({ x: nx, y: ny });
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  document.addEventListener("keydown", e => {
    if (KEYS[e.key]) {
      e.preventDefault();
      if (state === "idle" || state === "over") start();
      turn(...KEYS[e.key]);
    } else if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      if (state === "idle" || state === "over") start();
      else togglePause();
    } else if (e.key === "Enter" && (state === "idle" || state === "over")) {
      start();
    }
  });

  // touch swipe
  let touchStart = null;
  canvas.addEventListener("touchstart", e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
    }
    touchStart = null;
  });

  startBtn.addEventListener("click", () => state === "paused" ? togglePause() : start());

  speedEl.addEventListener("change", () => {
    speedEl.blur();
    if (state === "running") {
      clearInterval(timer);
      timer = setInterval(tick, Number(speedEl.value));
    }
  });

  colorEl.addEventListener("change", () => {
    colorEl.blur();
    hue = Number(colorEl.value);
    localStorage.setItem("snakeHue", hue);
    applyColor();
    draw();
  });

  state = "idle";
  applyColor();
  reset();
  draw();
})();
</script>
</body>
</html>
